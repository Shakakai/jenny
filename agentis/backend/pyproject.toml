[project]
name = "agentis-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.109.0",
  "uvicorn[standard]>=0.27.0",
  "pydantic>=2.0.0",
  "anthropic>=0.25.0",
  "mesa>=2.1.0",
  "pandas>=2.0.0",
  "pyarrow>=14.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["routers", "services"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
]
